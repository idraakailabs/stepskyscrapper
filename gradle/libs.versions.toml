[versions]
# Toolchain (latest stable, verified 2026-11-20 against Google Maven / Maven Central / Gradle Plugin Portal)
# AGP is pinned to the newest version current Android Studio supports (9.2.1); 9.5.1 builds from the
# command line but Studio refuses to sync it.
agp = "9.2.1"
kotlin = "2.4.21"
ksp = "2.3.14"
compileSdk = "37"
compileSdkMinor = "2"
targetSdk = "37"
minSdk = "26"
jvmTarget = "17"

# AndroidX
activityCompose = "1.13.0"
coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
composeBom = "2026.11.01"
lifecycle = "2.11.1"
navigation = "2.10.2"
room = "2.8.5"
datastore = "1.3.0"
work = "2.12.0"
healthConnect = "1.1.0"
glance = "1.2.0"
profileinstaller = "1.4.1"
benchmark = "1.5.0"
uiautomator = "2.4.1"
hilt = "2.60.1"
androidxHilt = "1.4.0"

# Google / Firebase
billing = "9.1.0"
playServicesAds = "25.5.0"
ump = "4.0.0"
firebaseBom = "35.2.0"
googleServices = "4.6.0"
crashlyticsPlugin = "3.0.8"

# Kotlin libraries
coroutines = "1.11.0"
serialization = "1.13.0"

# Testing
junit4 = "4.13.2"
androidxTestExt = "1.3.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
robolectric = "4.18.1"
roborazzi = "1.79.0"
turbine = "1.2.1"
truth = "1.4.5"

# Quality
ktlintPlugin = "14.2.0"
detekt = "1.23.8"

