org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# AdMob: debug builds always use Google's test ids (hard-coded in app/build.gradle.kts). The release build reads
# live ids from ADMOB_APP_ID_PROD and ADMOB_REWARDED_UNIT_ID_PROD, set in ~/.gradle/gradle.properties or as CI
# environment variables, never here. Without them bundleRelease fails and assembleRelease has ads disabled.
# Optional, debug only: ADMOB_TEST_DEVICE_ID (hashed id from logcat) and ADMOB_UMP_DEBUG_EEA=true.
# Hosted privacy policy (required by Play for Health Connect apps) and support address for diagnostics.
PRIVACY_POLICY_URL=
SUPPORT_EMAIL=
